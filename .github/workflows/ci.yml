name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/twynzo-v1-launch-blockers]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://twynzo.com
          NEXT_PUBLIC_DAILY_ENABLED: 'false'
          NEXT_PUBLIC_PARTY_ENABLED: 'true'
